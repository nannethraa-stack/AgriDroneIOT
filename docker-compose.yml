version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - MQTT_BROKER=localhost
      - MQTT_PORT=1883

  dashboard:
    build: ./apps/dashboard
    ports:
      - "5173:5173"

  mobile:
    build: ./apps/mobile 
    ports:
      - "8081:8081"
